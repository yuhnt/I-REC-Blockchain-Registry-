[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rec-a5"
version = "0.1.0"
description = "Đồ án A.5: registry chứng chỉ I-REC chống double counting (sổ cái chung, multi-oracle, phát hiện khai khống)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # Windows không có sẵn CSDL múi giờ cho zoneinfo
    "pvlib>=0.11",
    "scikit-learn>=1.5",
    "web3>=7.0",
    "eth-account>=0.13",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
